{% extends 'layout.html' %}

{% block content %}
<div class="card-box" style="max-width: 800px; margin: 0 auto;">
  <div class="card-title-header">
    <div>
      <div class="card-title"><i class="fa-solid fa-gear" style="color:var(--cyan-accent);"></i> Security Control Center</div>
      <div class="card-subtitle">Configure real-time safety notification triggers, visual themes, and automated risk control thresholds.</div>
    </div>
  </div>

  <form id="settings-form" onsubmit="saveSettings(event)">
    <!-- Section 1: Notifications -->
    <div style="margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border-subtle);">
      <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--cyan-accent);">
        🔔 Threat Notifications
      </h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <label style="display: flex; align-items: center; justify-content: space-between; font-size: 0.88rem; cursor: pointer;">
          <span>Enable general transaction safety alerts</span>
          <input type="checkbox" id="set-notif-safety" style="width: 18px; height: 18px;">
        </label>
        <label style="display: flex; align-items: center; justify-content: space-between; font-size: 0.88rem; cursor: pointer;">
          <span>Enable critical high-risk fraud alert popups</span>
          <input type="checkbox" id="set-notif-high-risk" style="width: 18px; height: 18px;">
        </label>
      </div>
    </div>

    <!-- Section 2: Appearance -->
    <div style="margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border-subtle);">
      <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--cyan-accent);">
        🎨 Console Appearance
      </h3>
      <div class="form-group" style="max-width: 320px;">
        <label for="set-theme-select">Interface Theme</label>
        <select id="set-theme-select" class="form-select">
          <option value="dark">🌙 Dark Cybersecurity Console (Default)</option>
          <option value="light">☀️ Light Banking Mode</option>
        </select>
      </div>
    </div>

    <!-- Section 3: Security Parameters -->
    <div style="margin-bottom: 24px;">
      <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--cyan-accent);">
        🛡️ Security Risk Controls
      </h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="set-auto-block">Auto-Block Risk Threshold (%)</label>
          <input type="number" id="set-auto-block" class="form-control" min="50" max="99" value="65">
        </div>
        <div class="form-group">
          <label for="set-session-timeout">Analyst Session Timeout (Minutes)</label>
          <input type="number" id="set-session-timeout" class="form-control" min="5" max="120" value="30">
        </div>
      </div>
    </div>

    <div>
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-floppy-disk"></i> Save Security Preferences
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const json = await res.json();
    if (json.success) {
      const data = json.data;
      document.getElementById('set-notif-safety').checked = data.notifications_safety === 'ON';
      document.getElementById('set-notif-high-risk').checked = data.notifications_high_risk === 'ON';
      const themeVal = data.appearance_theme || 'dark';
      document.getElementById('set-theme-select').value = themeVal;
      if (window.applyTheme) window.applyTheme(themeVal);
      document.getElementById('set-auto-block').value = data.auto_block_threshold || '65';
      document.getElementById('set-session-timeout').value = data.security_session_timeout || '30';
    }
  } catch (err) {
    console.error('Failed to load settings', err);
  }
}

async function saveSettings(e) {
  e.preventDefault();
  const chosenTheme = document.getElementById('set-theme-select').value;
  if (window.applyTheme) window.applyTheme(chosenTheme);

  const payload = {
    notifications_safety: document.getElementById('set-notif-safety').checked ? 'ON' : 'OFF',
    notifications_high_risk: document.getElementById('set-notif-high-risk').checked ? 'ON' : 'OFF',
    appearance_theme: chosenTheme,
    auto_block_threshold: document.getElementById('set-auto-block').value,
    security_session_timeout: document.getElementById('set-session-timeout').value
  };

  try {
    const res = await fetch('/api/settings', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.success) {
      showToast('Security preferences saved successfully!', 'success');
    } else {
      showToast(json.error, 'error');
    }
  } catch (err) {
    showToast(`Failed to save: ${err.message}`, 'error');
  }
}

document.addEventListener('DOMContentLoaded', loadSettings);
</script>
{% endblock %}
