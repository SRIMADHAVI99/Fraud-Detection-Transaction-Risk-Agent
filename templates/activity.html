{% extends 'layout.html' %}

{% block content %}
<div style="margin-bottom: 24px;">
  <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px;">
    📊 Risk Analytics
  </h1>
  <p style="color: var(--text-muted); font-size: 0.92rem;">
    Real-time visualization of payment safety metrics, risk trends, and payment method volume.
  </p>
</div>

<!-- Charts Grid -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px;">
  
  <!-- Chart 1: Risk Level Distribution -->
  <div class="card-box" style="margin-bottom: 0;">
    <div class="card-title-header">
      <div class="card-title"><i class="fa-solid fa-chart-pie" style="color:var(--cyan-accent);"></i> Payment Risk Distribution</div>
    </div>
    <div style="position: relative; height: 280px; display: flex; align-items: center; justify-content: center;">
      <canvas id="chart-risk-distribution"></canvas>
    </div>
  </div>

  <!-- Chart 2: 7-Day Trend -->
  <div class="card-box" style="margin-bottom: 0;">
    <div class="card-title-header">
      <div class="card-title"><i class="fa-solid fa-chart-line" style="color:var(--cyan-accent);"></i> 7-Day Safety Trend</div>
    </div>
    <div style="position: relative; height: 280px;">
      <canvas id="chart-trend"></canvas>
    </div>
  </div>

  <!-- Chart 3: Payment Method Volume -->
  <div class="card-box" style="grid-column: 1 / -1; margin-bottom: 0;">
    <div class="card-title-header">
      <div class="card-title"><i class="fa-solid fa-chart-bar" style="color:var(--cyan-accent);"></i> Payment Methods Volume</div>
    </div>
    <div style="position: relative; height: 260px;">
      <canvas id="chart-methods"></canvas>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% endblock %}
